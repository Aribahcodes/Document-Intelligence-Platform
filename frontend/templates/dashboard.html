{% extends "base.html" %}
{% block title %}Dashboard - Document Intelligence{% endblock %}
{% block content %}

<section class="panel">
  <h1>Process a document</h1>
  <form id="upload-form">
    <div class="field-row">
      <label for="document_type">Document type</label>
      <select id="document_type" name="document_type" required>
        <option value="invoice">Invoice</option>
        <option value="balance_sheet">Balance Sheet</option>
        <option value="profit_and_loss">Profit &amp; Loss</option>
        <option value="cash_flow_statement">Cash Flow Statement</option>
      </select>
    </div>
    <div class="field-row">
      <label for="file">File (PDF / JPG / PNG, up to 3 pages)</label>
      <input type="file" id="file" name="file" accept=".pdf,.jpg,.jpeg,.png" required />
    </div>
    <button type="submit" id="process-btn">Process document</button>
  </form>
  <div id="upload-status" class="status-msg"></div>
</section>

<section class="panel">
  <div class="panel-header">
    <h2>Processed documents</h2>
    <button id="refresh-btn" class="secondary" type="button">Refresh</button>
  </div>
  <table class="doc-table">
    <thead>
      <tr>
        <th>Document name</th>
        <th>Type</th>
        <th>Status</th>
        <th>Processed at</th>
      </tr>
    </thead>
    <tbody id="doc-table-body">
      <tr><td colspan="4" class="empty-row">Loading...</td></tr>
    </tbody>
  </table>
</section>

{% endblock %}
{% block scripts %}
<script src="{{ url_for('frontend.static', filename='js/dashboard.js') }}"></script>
{% endblock %}
